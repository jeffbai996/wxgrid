# Drop-in for the global ingest timer once Google has allowlisted your GCP
# project for WeatherNext 2. Install as
#   ~/.config/systemd/user/wxgrid-ingest.service.d/wn2.conf
# then `systemctl --user daemon-reload`. The model is optional: without
# WXGRID_WN2_ZARR the ingest never mentions it. The service-account key needs
# Storage Object Viewer on the bucket; keep it outside the repo.
[Service]
Environment=WXGRID_WN2_ZARR=gs://weathernext/weathernext_2_0_0_mean/zarr
Environment=GOOGLE_APPLICATION_CREDENTIALS=%h/.config/wxgrid/gcp-weathernext.json
