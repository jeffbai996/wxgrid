<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>wxgrid</title>
<link rel="stylesheet" href="vendor/maplibre-gl.css">
<link rel="stylesheet" href="styles.css">
<link rel="stylesheet" href="private/theme.css">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="logo.svg" type="image/svg+xml">
<link rel="icon" href="icon-32.png" sizes="32x32" type="image/png">
<link rel="apple-touch-icon" href="icon-180.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="theme-color" content="#0b0d10">
</head>
<body>
<div id="map"></div>
<canvas id="particles"></canvas>

<header id="topbar">
  <a class="brand" href="./" title="wxgrid"><img src="logo.svg" alt="" width="26" height="26"><span>wxgrid</span></a>
  <form id="search" class="search" role="search" autocomplete="off">
    <input id="q" type="search" placeholder="Search a place" aria-label="Search a place" enterkeyhint="search">
  </form>
  <div class="seg" id="models" role="tablist" aria-label="Model"></div>
  <select id="run" class="run" title="Model run (UTC)"></select>
  <div class="spacer"></div>
  <div class="seg small" id="levels" hidden aria-label="Altitude"></div>
  <button id="radar-toggle" class="chip" title="Live radar (RainViewer)">radar</button>
  <button id="particles-toggle" class="chip on" title="Wind particles">particles</button>
  <button id="units-toggle" class="chip mono" title="Wind units">km/h</button>
  <button id="locate" class="icon" title="My location">◎</button>
</header>

<nav id="layers" class="rail" aria-label="Layers"></nav>

<aside id="legend" hidden>
  <div class="legend-bar"></div>
  <div class="legend-ticks"></div>
</aside>

<footer id="timebar">
  <div class="tape-head">
    <button id="play" class="icon" title="Animate (space)">▶</button>
    <div class="time-meta">
      <span id="valid-local"></span>
      <span id="valid-utc" class="mono dim"></span>
    </div>
    <span id="lead" class="mono dim"></span>
    <span id="tape-where" class="dim"></span>
  </div>
  <div id="tape" class="tape" tabindex="0" aria-label="Forecast timeline"></div>
  <input id="step" type="range" min="0" max="0" value="0" step="1" aria-label="Forecast step">
</footer>

<div id="point" hidden>
  <div class="point-head">
    <span id="point-title"></span>
    <span class="point-tabs seg small">
      <button data-tab="now" class="on">Now</button><button data-tab="aloft">Aloft</button><button data-tab="out">Outdoors</button>
    </span>
    <button id="point-close" class="icon" title="Close">×</button>
  </div>
  <div id="point-body">
    <section data-pane="now">
      <div id="point-now"></div>
      <canvas id="meteogram" width="640" height="220"></canvas>
    </section>
    <section data-pane="aloft" hidden><div id="aloft"></div></section>
    <section data-pane="out" hidden><div id="outdoors"></div></section>
  </div>
  <div id="point-foot" class="dim"></div>
</div>

<div id="toast" hidden></div>

<script src="vendor/maplibre-gl.js"></script>
<script src="particles.js"></script>
<script src="app.js"></script>
</body>
</html>
