<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64">
  <!-- wxgrid mark: three streamlines bending around a low — the wind field on a grid. -->
  <defs>
    <linearGradient id="g" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#6cb6ff"/>
      <stop offset="1" stop-color="#3f7fd6"/>
    </linearGradient>
  </defs>
  <rect x="2" y="2" width="60" height="60" rx="16" fill="#0b0d10"/>
  <rect x="2" y="2" width="60" height="60" rx="16" fill="none" stroke="rgba(255,255,255,0.09)"/>
  <!-- faint grid -->
  <path d="M20 8v48M32 8v48M44 8v48M8 20h48M8 32h48M8 44h48" stroke="rgba(255,255,255,0.07)" stroke-width="1"/>
  <!-- streamlines -->
  <path d="M10 22c10-9 22-9 30 0s16 9 16 9" fill="none" stroke="url(#g)" stroke-width="4.2" stroke-linecap="round"/>
  <path d="M8 34c10-9 22-9 30 0s16 9 18 9" fill="none" stroke="#e8eef7" stroke-width="4.2" stroke-linecap="round" opacity=".92"/>
  <path d="M12 46c10-9 22-9 30 0s12 7 12 7" fill="none" stroke="#ffb454" stroke-width="4.2" stroke-linecap="round" opacity=".95"/>
</svg>
